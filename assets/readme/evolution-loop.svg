<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Bounded evolution loop</title>
  <desc id="desc">A weekly research loop from generation to review, human policy gate, reversible evolution and the next cycle.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#071A2F"/><stop offset="1" stop-color="#123C5A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#00111F" flood-opacity=".35"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#79D8C2"/></marker>
  </defs>
  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <text x="90" y="105" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="48" font-weight="700">Bounded Evolution Loop</text>
  <text x="92" y="150" fill="#A9C9DC" font-family="Arial, sans-serif" font-size="24">Evidence first · visible failure states · human gate · reversible promotion</text>

  <g filter="url(#shadow)">
    <rect x="90" y="245" width="260" height="150" rx="22" fill="#1E6E8C"/>
    <rect x="430" y="245" width="260" height="150" rx="22" fill="#2D8A7D"/>
    <rect x="770" y="220" width="300" height="200" rx="22" fill="#D38B3C"/>
    <rect x="1150" y="245" width="260" height="150" rx="22" fill="#6A65B5"/>
  </g>
  <g fill="#FFFFFF" font-family="Arial, sans-serif" text-anchor="middle">
    <text x="220" y="300" font-size="30" font-weight="700">W1 · Generate</text>
    <text x="220" y="342" font-size="21">cutoff + evidence</text>
    <text x="220" y="372" font-size="18" fill="#D8F4FF">report scaffold</text>
    <text x="560" y="300" font-size="30" font-weight="700">W2 · Review</text>
    <text x="560" y="342" font-size="21">forecast vs actual</text>
    <text x="560" y="372" font-size="18" fill="#DDF8F1">recurring gap?</text>
    <text x="920" y="282" font-size="30" font-weight="700">W2.5 · Human gate</text>
    <text x="920" y="326" font-size="21">rules · thresholds</text>
    <text x="920" y="356" font-size="21">roles · prompts · sources</text>
    <text x="920" y="390" font-size="18" fill="#FFF1D7">approve / defer / reject</text>
    <text x="1280" y="300" font-size="30" font-weight="700">W3 · Evolve</text>
    <text x="1280" y="342" font-size="21">test + promote</text>
    <text x="1280" y="372" font-size="18" fill="#E8E5FF">keep rollback path</text>
  </g>

  <path d="M350 320 H420" stroke="#79D8C2" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
  <path d="M690 320 H760" stroke="#79D8C2" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
  <path d="M1070 320 H1140" stroke="#79D8C2" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
  <path d="M1280 430 C1280 650 220 650 220 420" stroke="#79D8C2" stroke-width="6" fill="none" stroke-dasharray="16 12" marker-end="url(#arrow)"/>

  <g font-family="Arial, sans-serif">
    <rect x="200" y="720" width="1200" height="100" rx="18" fill="#0A233A" stroke="#3E6D87" stroke-width="2"/>
    <text x="800" y="760" fill="#FFFFFF" font-size="25" text-anchor="middle" font-weight="700">Safety invariants</text>
    <text x="800" y="795" fill="#B9D3E1" font-size="20" text-anchor="middle">No silent fallback · no private data · no order routing · post-render checks · reversible change</text>
  </g>
</svg>
